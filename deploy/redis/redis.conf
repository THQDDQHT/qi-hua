bind 0.0.0.0
protected-mode yes
port 6379
aclfile /run/secrets/users.acl

dir /data
appendonly yes
appendfsync everysec
aof-use-rdb-preamble yes
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

maxmemory 256mb
maxmemory-policy noeviction

timeout 0
tcp-keepalive 60
databases 16
loglevel notice
