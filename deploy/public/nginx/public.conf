limit_req_zone $binary_remote_addr zone=image_api:10m rate=5r/m;
limit_req_status 429;

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/tls/origin.crt;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/includes/cloudflare-trusted.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 22m;
    include /etc/nginx/includes/security-headers.conf;

    location = /api/images/generations {
        limit_req zone=image_api burst=2 nodelay;
        proxy_pass http://api:3001;
        include /etc/nginx/includes/proxy-public.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /api/images/edits {
        limit_req zone=image_api burst=2 nodelay;
        proxy_pass http://api:3001;
        include /etc/nginx/includes/proxy-public.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://api:3001;
        include /etc/nginx/includes/proxy-public.conf;
        add_header Cache-Control "no-store" always;
    }

    location /health/ {
        proxy_pass http://api:3001;
        include /etc/nginx/includes/proxy-public.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|mjs|map|woff2?|ttf|eot|svg|png|jpe?g|webp|avif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
