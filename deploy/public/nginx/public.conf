limit_req_zone $binary_remote_addr zone=image_api:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    # Compose resolves tunnel-origin to the exact host address used by cloudflared.
    # Trust that address only; do not trust the whole LAN or Docker address ranges.
    set_real_ip_from tunnel-origin;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    include /etc/nginx/includes/cloudflare-trusted.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    client_max_body_size 22m;
    include /etc/nginx/includes/security-headers.conf;

    location = /api/images/generations {
        limit_req zone=image_api burst=2 nodelay;
        proxy_pass http://api:3001;
        include /etc/nginx/includes/proxy-public.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /api/images/edits {
        limit_req zone=image_api burst=2 nodelay;
        proxy_pass http://api:3001;
        include /etc/nginx/includes/proxy-public.conf;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass http://api:3001;
        include /etc/nginx/includes/proxy-public.conf;
        add_header Cache-Control "no-store" always;
    }

    location /health/ {
        proxy_pass http://api:3001;
        include /etc/nginx/includes/proxy-public.conf;
        add_header Cache-Control "no-store" always;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location = /prompt-library/prompts.json {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /prompt-library/covers/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~* \.(?:css|js|mjs|map|woff2?|ttf|eot|svg|png|jpe?g|webp|avif|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
}
