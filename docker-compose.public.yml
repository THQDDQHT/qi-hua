name: infinite-canvas-public

services:
  api:
    image: infinite-canvas-public-api:local
    build:
      context: ./server
      dockerfile: Dockerfile
    env_file:
      - .env.public
      - ${REDIS_ENV_FILE:?REDIS_ENV_FILE is required}
    expose:
      - "3001"
    volumes:
      - type: bind
        source: ./data/public-generation-temp
        target: /data/public-generation-temp
        read_only: false
        bind:
          create_host_path: false
    restart: unless-stopped
    networks:
      - public-internal
      - database

  worker:
    image: infinite-canvas-public-api:local
    env_file:
      - .env.public
      - ${REDIS_ENV_FILE:?REDIS_ENV_FILE is required}
    command: ["bun", "src/worker.ts"]
    volumes:
      - type: bind
        source: ./data/public-generation-temp
        target: /data/public-generation-temp
        read_only: false
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:'+process.env.WORKER_HEALTH_PORT+'/health/ready');if(!r.ok)process.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    stop_grace_period: 15m
    restart: unless-stopped
    networks:
      - database

  web:
    image: infinite-canvas-public-web:local
    build:
      context: .
      dockerfile: Dockerfile
      target: public-web
      args:
        VITE_APP_MODE: public
    depends_on:
      api:
        condition: service_healthy
    extra_hosts:
      - "tunnel-origin=${PUBLIC_WEB_BIND_IP:?PUBLIC_WEB_BIND_IP is required}"
    ports:
      - "${PUBLIC_WEB_BIND_IP:?PUBLIC_WEB_BIND_IP is required}:${PUBLIC_WEB_PORT:?PUBLIC_WEB_PORT is required}:443"
    volumes:
      - type: bind
        source: ${PUBLIC_TLS_CERT_PATH:?PUBLIC_TLS_CERT_PATH is required}
        target: /etc/nginx/tls/origin.crt
        read_only: true
      - type: bind
        source: ${PUBLIC_TLS_KEY_PATH:?PUBLIC_TLS_KEY_PATH is required}
        target: /etc/nginx/tls/origin.key
        read_only: true
      - type: bind
        source: ./data/prompt-library
        target: /usr/share/nginx/html/prompt-library
        read_only: true
    restart: unless-stopped
    networks:
      - public-internal

  prompt-sync:
    image: infinite-canvas-prompt-sync:local
    build:
      context: .
      dockerfile: Dockerfile
      target: prompt-sync
    profiles:
      - maintenance
    volumes:
      - type: bind
        source: ./data/prompt-library
        target: /data/prompt-library
    restart: "no"
    networks:
      - public-internal

networks:
  public-internal:
    driver: bridge
  database:
    name: ${DATABASE_DOCKER_NETWORK:?DATABASE_DOCKER_NETWORK is required}
    external: true
