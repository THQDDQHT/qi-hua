name: Public service CI

on:
  pull_request:
    paths:
      - "server/**"
      - "deploy/public/**"
      - "Dockerfile"
      - "docker-compose.public.yml"
      - ".env.public.example"
      - ".github/workflows/public-service-ci.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - "deploy/public/**"
      - "Dockerfile"
      - "docker-compose.public.yml"
      - ".env.public.example"
      - ".github/workflows/public-service-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: infinite_canvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d infinite_canvas_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/infinite_canvas_test
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install server dependencies
        working-directory: server
        run: bun install --frozen-lockfile

      - name: Install locked TypeScript toolchain
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Typecheck server
        run: web/node_modules/.bin/tsc -p server/tsconfig.json --noEmit

      - name: Test server
        working-directory: server
        run: bun test

  deployment-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build public images
        run: |
          docker build -t infinite-canvas-public-api:ci ./server
          docker build \
            --target public-web \
            --build-arg VITE_APP_MODE=public \
            -t infinite-canvas-public-web:ci .

      - name: Create temporary public configuration
        run: |
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout "$RUNNER_TEMP/origin.key" \
            -out "$RUNNER_TEMP/origin.crt" \
            -days 1 -subj "/CN=public-ci.invalid"
          cat > .env.public <<EOF
          PUBLIC_WEB_PORT=8443
          PUBLIC_TLS_CERT_PATH=$RUNNER_TEMP/origin.crt
          PUBLIC_TLS_KEY_PATH=$RUNNER_TEMP/origin.key
          PORT=3001
          DATABASE_DOCKER_NETWORK=public-ci-database
          DATABASE_URL=postgres://ci:ci@postgres.invalid/infinite_canvas
          AI_BASE_URL=https://provider.invalid/v1
          AI_API_KEY=ci-placeholder-key
          AI_MODEL=ci-placeholder-model
          ANON_TOKEN_SECRET=ci-anonymous-secret-000000000000000
          IP_HASH_SECRET=ci-ip-hash-secret-00000000000000000
          IDEMPOTENCY_SECRET=ci-idempotency-secret-000000000000
          PUBLIC_ORIGIN=https://public-ci.invalid
          PUBLIC_GENERATION_ENABLED=false
          DAILY_DEVICE_LIMIT=10
          DAILY_IP_LIMIT=30
          TIMEZONE=Asia/Shanghai
          UPSTREAM_TIMEOUT_MS=180000
          RESERVATION_TTL_SECONDS=600
          EOF

      - name: Validate Compose configuration
        run: docker compose --env-file .env.public -f docker-compose.public.yml config --quiet

      - name: Validate Nginx configuration
        run: |
          docker run --rm \
            --add-host api:127.0.0.1 \
            -v "$RUNNER_TEMP/origin.crt:/etc/nginx/tls/origin.crt:ro" \
            -v "$RUNNER_TEMP/origin.key:/etc/nginx/tls/origin.key:ro" \
            infinite-canvas-public-web:ci nginx -t
